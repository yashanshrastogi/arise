        fill="none" stroke="url(#wave)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M11 45 C20 39.5, 29 39.9, 37 44.5 C43 48, 49 48, 54 44.7"
        fill="none" stroke="#1AD9FF" stroke-width="2.25" stroke-linecap="round" opacity=".92"/>

  <!-- leaf -->
  <path d="M41.5 25.5 C47 18.7, 54 19.2, 56.5 18.2 C56.2 24.8, 52.9 31.1, 45 31.8 C42.4 31.1, 40.8 29, 41.5 25.5 Z"
        fill="url(#leaf)"/>
  <path d="M43.5 30 C47.1 26.6, 51.3 23.4, 54.9 20.6"
