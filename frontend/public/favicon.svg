<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17136B"/>
      <stop offset="55%" stop-color="#5B4BDB"/>
      <stop offset="100%" stop-color="#168BFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57E7FF"/>
      <stop offset="100%" stop-color="#119CFF"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#20C7B7"/>
      <stop offset="100%" stop-color="#7CF28D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- A -->
  <path d="M19 49 L28.5 17.5 Q30.2 12 34 12 Q37.8 12 39.5 17.5 L49 49 L41.5 49 L38.9 40.2 L29.1 40.2 L26.5 49 Z
           M31.1 33.8 L36.9 33.8 L34 23.2 Z"
        fill="#FFFFFF"/>

